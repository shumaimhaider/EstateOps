name: management-portal-ci

on:
  push:
    paths:
      [
        "EstateOpsManagementPortalUI/**",
        ".github/workflows/management-portal-ci.yml",
      ]
  pull_request:
    paths:
      [
        "EstateOpsManagementPortalUI/**",
        ".github/workflows/management-portal-ci.yml",
      ]

defaults:
  run:
    working-directory: EstateOpsManagementPortalUI

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EstateOpsManagementPortalUI/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - run: npm run size
