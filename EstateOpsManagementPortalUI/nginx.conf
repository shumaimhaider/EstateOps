server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  location = /healthz { access_log off; return 200 'ok'; }

  # the API: one address for the browser
  location /api/ {
    proxy_pass ${GATEWAY_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # single-page app: unknown paths open index.html; built assets are cached for a year
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
